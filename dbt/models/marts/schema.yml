version: 2

models:
  - name: dim_customers
    description: one row per customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]

  - name: dim_products
    description: one row per product, with its category folded in
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category_name
        tests: [not_null]

  - name: dim_date
    description: one row per calendar day covering the order date range
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fact_orders
    description: "grain: one row per order line"
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: quantity
        tests: [not_null]
      - name: line_total
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: [pending, paid, shipped, delivered, cancelled, returned]
